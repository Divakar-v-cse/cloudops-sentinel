# Secret scanning rules for Trivy (enable-builtin-rules keeps the defaults too)
enable-builtin-rules: true

rules:
  - id: sentinel-aws-access-key
    description: AWS access key id
    regex: '(A3T[A-Z0-9]|AKIA|ASIA)[A-Z0-9]{16}'
    keywords:
      - AKIA
      - ASIA
    severity: CRITICAL
    category: AWS

  - id: sentinel-private-key
    description: PEM private key block
    regex: '-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----'
    keywords:
      - BEGIN
      - PRIVATE KEY
    severity: CRITICAL
    category: AsymmetricPrivateKey

  - id: sentinel-jwt
    description: Hardcoded JWT
    regex: 'eyJ[A-Za-z0-9_=-]{10,}\.[A-Za-z0-9_=-]{10,}\.[A-Za-z0-9_=-]{10,}'
    keywords:
      - eyJ
    severity: HIGH
    category: JWT

allow-rules:
  # Documentation and examples legitimately contain placeholders.
  - id: allow-placeholders
    description: Documented placeholder values
    path: '(\.env\.example|README\.md|docs/.*\.md|.*\.example|security/reports/.*)'
  - id: allow-test-fixtures
    description: Test-only credentials
    path: 'backend/tests/.*'
