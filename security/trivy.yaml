# Trivy configuration used by CI and by scripts/security-scan.sh
# Run: trivy fs --config security/trivy.yaml .
severity:
  - CRITICAL
  - HIGH
  - MEDIUM

scan:
  scanners:
    - vuln
    - misconfig
    - secret
  skip-dirs:
    - .venv
    - node_modules
    - frontend/dist
    - .git
    - infrastructure/terraform/.terraform
  skip-files:
    - "**/*.lock"
    - "package-lock.json"

vulnerability:
  ignore-unfixed: true

misconfiguration:
  include-non-failures: false

secret:
  config: security/trivy-secret.yaml

exit-code: 0
format: table
