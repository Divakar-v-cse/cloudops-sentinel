# Prometheus scrape configuration for CloudOps Sentinel.
# Run: prometheus --config.file=monitoring/prometheus.yml
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: cloudops-sentinel

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: sentinel-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: cloudops-sentinel
          env: local

  # Inside docker compose, replace the target with:
  #   - targets: ["backend:8000"]
