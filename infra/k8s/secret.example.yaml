# EXAMPLE ONLY - do not commit real values.
# Create the real secret out-of-band, e.g.:
#   kubectl -n cloudops-sentinel create secret generic sentinel-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://sentinel:<password>@postgres:5432/cloudops" \
#     --from-literal=DEFAULT_ADMIN_PASSWORD="<strong-password>"
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: cloudops-sentinel
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_32_BYTE_HEX"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  DATABASE_URL: "postgresql+psycopg://sentinel:REPLACE@postgres:5432/cloudops"
  DEFAULT_ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  AI_API_KEY: ""
