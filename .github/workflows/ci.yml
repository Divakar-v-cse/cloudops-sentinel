name: sentinel-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests --output-format=concise

      - name: Pytest
        env:
          DATABASE_URL: sqlite:///./ci.db
          ENABLE_SCHEDULER: "false"
          SECRET_KEY: ci-only-secret-not-used-in-production
        run: pytest -q

      - name: Upload test database on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-database
          path: backend/*.db
          retention-days: 3

  frontend-build:
    name: Frontend install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  dependency-scan:
    name: Dependency and code security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install pip-audit bandit

      - name: pip-audit (report only)
        run: pip-audit -r requirements.txt --format json --output pip-audit.json || true

      - name: Bandit (high severity report)
        run: bandit -r app -f json -o bandit.json -lll || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            backend/pip-audit.json
            backend/bandit.json
          retention-days: 14

  container-build:
    name: Docker build and Trivy scan
    runs-on: ubuntu-latest
    needs: [backend-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t cloudops-sentinel-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t cloudops-sentinel-frontend:${{ github.sha }} ./frontend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudops-sentinel-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Trivy dependency scan (fail on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: "tests"

  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  compose-validate:
    name: Validate compose and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        env:
          SECRET_KEY: ci-placeholder-secret
          POSTGRES_PASSWORD: ci-placeholder-password
          DEFAULT_ADMIN_PASSWORD: ci-placeholder-admin
        run: docker compose config --quiet

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD/infra/k8s:/manifests" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /manifests
