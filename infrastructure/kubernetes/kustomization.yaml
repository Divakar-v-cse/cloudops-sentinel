apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudops-sentinel

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - hpa.yaml

# Create the Secret before applying:
#   kubectl apply -f infrastructure/kubernetes/secret.example.yaml   # replace values first, or
#   kubectl -n cloudops-sentinel create secret generic sentinel-secrets --from-literal=...
# secret.example.yaml is intentionally NOT listed here so placeholder values are
# never applied by accident.

images:
  - name: ghcr.io/example/cloudops-sentinel-backend
    newTag: 1.0.0
  - name: ghcr.io/example/cloudops-sentinel-frontend
    newTag: 1.0.0

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: cloudops-sentinel
